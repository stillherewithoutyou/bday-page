<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    overflow: hidden;
}

.container {
    text-align: center;
    color: white;
    animation: fadeIn 2s ease-in-out;
}

h1 {
    font-size: 3em;
    margin-bottom: 10px;
}

p {
    font-size: 1.2em;
    opacity: 0.9;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #ee9ca7;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* floating hearts */
.heart {
    position: absolute;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-100vh); opacity: 0;}
}
</style>
</head>

<body>
    
<button onclick="document.getElementById('music').play()">Play Music 🎵</button>

<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>
<div class="container">
    <h1>🎉 Happy Birthday🎉</h1>
    <h2>🎉 Happy Birthday🎉</h2>
    <button onclick="showMessage()">Touch me 💌</button>
    <p id="hiddenMessage" style="display:none; margin-top:15px;">
        Terima kasih sudah hadir di dunia ini 💖<br>
        Semoga semua impian kamu tercapai 🌷
    </p>
</div>

<script>
function showMessage() {
    document.getElementById("hiddenMessage").style.display = "block";
}

// generate floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 300);
</script>

</body>
</html>
