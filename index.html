<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>💌</title>

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
font-family:Poppins,sans-serif;
overflow:hidden;
}

.card{

text-align:center;

color:white;

padding:50px;

border-radius:30px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

box-shadow:0 8px 32px rgba(0,0,0,.15);

animation:fadeIn 2s ease;

}

button{

margin-top:30px;

padding:12px 25px;

border:none;

border-radius:25px;

background:white;

color:#ee9ca7;

cursor:pointer;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>
</head>

<body>

<div class="card">

<h1>💌</h1>

<p>

Happy Birthday 🤍

<br><br>

No matter how much time passes,

you'll always have a special place

in my heart.

<br><br>

Thank you for existing.

🌷

</p>

<button onclick="window.location.href='gallery.html'">

Continue →

</button>

</div>

</body>
</html>
